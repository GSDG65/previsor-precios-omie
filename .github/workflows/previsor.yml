# Previsor de precios OMIE · ejecución diaria en GitHub (sin necesidad de tener el PC encendido)
#   1. descarga datos y emite/congela la previsión D+1..D+5 (actualizacion_diaria.py)
#   2. guarda los datos en el repositorio
#   3. publica el visor en GitHub Pages
#   4. (opcional) envía un resumen al móvil con ntfy si existe el secreto NTFY_TOPIC
name: Previsor precios OMIE

on:
  schedule:
    - cron: "35 15 * * *"      # 16:35 en invierno, 17:35 en verano (GitHub usa UTC)
  workflow_dispatch:            # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: previsor
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      TZ: Europe/Madrid
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualización diaria
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python actualizacion_diaria.py

      - name: Guardar datos en el repositorio
        if: always()
        run: |
          cp "$(ls -t logs/actualizacion_diaria_*.log | head -1)" datos/ultimo_log.txt || true
          git config user.name "previsor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datos
          if git diff --cached --quiet; then echo "sin cambios"; else
            git commit -q -m "Datos y previsión $(date +%F)"
            git pull -q --rebase && git push -q
          fi

      - name: Guardar el log de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Preparar la página
        run: |
          mkdir -p _site/datos
          cp previsor_precios_omie.html _site/index.html
          cp datos/previsor_datos.js _site/datos/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Aviso al móvil (ntfy)
        if: ${{ env.NTFY_TOPIC != '' }}
        env:
          PAGINA: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python resumen_movil.py

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
